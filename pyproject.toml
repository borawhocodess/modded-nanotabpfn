[project]
name = "modded-nanotabpfn"
version = "0.1.0"
description = "speedrun"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "h5py>=3.15.0",
    "numpy>=2.3.3",
    "openml>=0.15.1",
    "pandas>=2.3.3",
    "schedulefree>=1.4.1",
    "scikit-learn>=1.7.2",
    "torch>=2.8.0",
]

[project.optional-dependencies]
scripts = [
    "matplotlib",
]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
ignore = ["E741"]
